[package]
name = "host-router"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Bounded TCP SNI/HTTP and UDP QUIC domain router"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
quinn-udp = { version = "0.5.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

nix = { version = "0.31.3", features = ["fs", "zerocopy", "user", "feature"] }

ring = "0.17.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
